# Render blueprint for the Hoardrun API (docs/hosting.md).
#
# Secrets are never written here: every `sync: false` value is entered once in the Render
# dashboard (or the blueprint's first-sync form) and stays there.
services:
  - type: web
    name: hoardrun-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Near US customers and a US database
    region: virginia
    # Always on: Stripe waits under 2 seconds for card approvals, so the API can't sleep
    plan: standard
    numInstances: 1
    healthCheckPath: /health
    # Before new code takes traffic; if it fails, the old version keeps running
    preDeployCommand: python -m app.database.migrate upgrade
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: WEB_CONCURRENCY
        value: "2"

      # Database (docs/production-database.md): the app user, and the owner for migrations
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require

      # Keys made once and kept: losing DATA_ENCRYPTION_KEY loses the encrypted columns
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false

      # Where the web app lives
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Providers
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ISSUING_WEBHOOK_SECRET
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      # sandbox until Plaid approves production access, then production
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: API_URL
        sync: false
      - key: PERSONA_API_KEY
        sync: false
      - key: PERSONA_TEMPLATE_ID
        sync: false
      - key: PERSONA_WEBHOOK_SECRET
        sync: false
      - key: ALPACA_BROKER_KEY
        sync: false
      - key: ALPACA_BROKER_SECRET
        sync: false
      - key: ALPACA_FIRM_ACCOUNT_ID
        sync: false
      # sandbox until the Alpaca agreement is signed, then live
      - key: ALPACA_ENV
        value: sandbox
      - key: ANTHROPIC_API_KEY
        sync: false
